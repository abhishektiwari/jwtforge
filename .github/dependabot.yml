version: 2
updates:
  # Check for npm dependency updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 2
    reviewers:
      - "abhishektiwari"
    assignees:
      - "abhishektiwari"
    allow:
      - dependency-name: "@faker-js/faker"
      - dependency-name: "blns"
      - dependency-name: "wrangler"
      - dependency-name: "@docusaurus/*"
      - dependency-name: "docusaurus-plugin-llms"
      - dependency-name: "@mdx-js/react"
      - dependency-name: "prism-react-renderer"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "clsx"
      - dependency-name: "jest"
      - dependency-name: "babel-jest"
      - dependency-name: "@babel/preset-env"
      - dependency-name: "newman"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    rebase-strategy: "auto"
    groups:
      docs:
        patterns:
          - "@docusaurus/*"
          - "docusaurus-plugin-llms"
          - "@mdx-js/*"
          - "prism-react-renderer"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "clsx"
      worker-runtime:
        patterns:
          - "wrangler"
      testing:
        patterns:
          - "jest"
          - "babel-jest"
          - "@babel/preset-env"
          - "newman"
      security-data:
        patterns:
          - "@faker-js/faker"
          - "blns"

  # Check for GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 1
    reviewers:
      - "abhishektiwari"
    assignees:
      - "abhishektiwari"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
