version: 2
updates:
  # Check for npm dependency updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "abhishektiwari"
    assignees:
      - "abhishektiwari"
    allow:
      - dependency-type: "all"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    rebase-strategy: "auto"
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - "@mdx-js/*"
          - "prism-react-renderer"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "clsx"
      testing:
        patterns:
          - "jest"
          - "babel-jest"
          - "@babel/*"
          - "newman"
      worker-runtime:
        patterns:
          - "wrangler"
      security-data:
        patterns:
          - "@faker-js/faker"
          - "blns"

  # Check for GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "abhishektiwari"
    assignees:
      - "abhishektiwari"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
