name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js for JWTForge
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install JWTForge dependencies
      run: npm ci

    - name: Install wrangler
      run: npm install -g @cloudflare/wrangler

    - name: Start JWTForge dev server
      run: npm run dev &
      timeout-minutes: 2

    - name: Wait for JWTForge to be ready
      run: |
        echo "Waiting for JWTForge to start..."
        for i in {1..30}; do
          if curl -f http://localhost:8787/ 2>/dev/null; then
            echo "✓ JWTForge is ready"
            exit 0
          fi
          echo "Attempt $i/30: JWTForge not ready, waiting..."
          sleep 1
        done
        echo "❌ JWTForge failed to start"
        exit 1

    - name: Set up Python for FastAPI example
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'example/requirements.txt'

    - name: Install FastAPI example dependencies
      working-directory: example
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create example .env file
      working-directory: example
      run: |
        cat > .env << 'EOF'
        DATABASE_URL=sqlite:///./example.db
        AXIOMS_AUDIENCE=http://localhost:8000
        AXIOMS_ISS_URL=http://localhost:8787
        EOF

    - name: Run database migrations
      working-directory: example
      run: alembic upgrade head

    - name: Start FastAPI dev server
      working-directory: example
      run: |
        uvicorn main:app --host 0.0.0.0 --port 8000 &
      timeout-minutes: 2

    - name: Wait for FastAPI to be ready
      run: |
        echo "Waiting for FastAPI to start..."
        for i in {1..30}; do
          if curl -f http://localhost:8000/docs 2>/dev/null; then
            echo "✓ FastAPI is ready"
            exit 0
          fi
          echo "Attempt $i/30: FastAPI not ready, waiting..."
          sleep 1
        done
        echo "❌ FastAPI failed to start"
        exit 1

    - name: Install Newman
      run: npm install -g newman

    - name: Run integration tests
      run: |
        npx newman run example/Axioms_FastAPI_Example.postman_collection.json \
          -e example/Axioms_FastAPI_Example.postman_environment.json \
          --delay-request 5000 \
          --reporters cli,json \
          --reporter-json-export integration-test-results.json || true

    - name: Upload integration test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: integration-test-results
        path: integration-test-results.json

    - name: Summary
      if: always()
      run: |
        echo "## Integration Test Summary"
        if [ -f integration-test-results.json ]; then
          PASSED=$(jq '.run.stats.assertions.passed' integration-test-results.json)
          FAILED=$(jq '.run.stats.assertions.failed' integration-test-results.json)
          echo "✓ Passed: $PASSED"
          echo "❌ Failed: $FAILED"
          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi
        fi
