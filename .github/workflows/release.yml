name: Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
    branches: [ main ]

jobs:
  generate-version:
    runs-on: ubuntu-latest
    # Skip if Tests workflow failed
    if: ${{ github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      version: ${{ steps.generate_version.outputs.version }}
      version_tag: ${{ steps.generate_version.outputs.version_tag }}
      github_tag: ${{ steps.generate_version.outputs.github_tag }}
      is_prerelease: ${{ steps.generate_version.outputs.is_prerelease }}
      pr_number: ${{ github.event.number }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate version for PR
      if: github.event_name == 'pull_request'
      id: generate_pr_version
      run: |
        # Get base version from latest tag or default to 0.0.0
        BASE_VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")

        # Generate PEP 440 compatible pre-release version with timestamp
        SHORT_SHA=$(git rev-parse --short HEAD)
        PR_NUMBER=${{ github.event.number }}
        TIMESTAMP=$(date +%s)

        # Use PEP 440 compatible format with PR number and timestamp
        PRERELEASE_VERSION="${BASE_VERSION}rc${PR_NUMBER}${TIMESTAMP}"
        PRERELEASE_TAG="v${PRERELEASE_VERSION}"

        # GitHub tag for releases (with PR number and timestamp)
        GITHUB_TAG="v${PRERELEASE_VERSION}"

        echo "version=$PRERELEASE_VERSION" >> $GITHUB_OUTPUT
        echo "version_tag=$PRERELEASE_TAG" >> $GITHUB_OUTPUT
        echo "github_tag=$GITHUB_TAG" >> $GITHUB_OUTPUT
        echo "is_prerelease=true" >> $GITHUB_OUTPUT

    - name: Generate version for release
      if: github.event_name == 'workflow_run'
      id: generate_release_version
      uses: paulhatch/semantic-version@v5.4.0
      with:
        tag_prefix: "v"
        major_pattern: "(MAJOR)"
        minor_pattern: "(MINOR)"
        version_format: "${major}.${minor}.${patch}"
        bump_each_commit: true

    - name: Set outputs
      id: generate_version
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "version=${{ steps.generate_pr_version.outputs.version }}" >> $GITHUB_OUTPUT
          echo "version_tag=${{ steps.generate_pr_version.outputs.version_tag }}" >> $GITHUB_OUTPUT
          echo "github_tag=${{ steps.generate_pr_version.outputs.github_tag }}" >> $GITHUB_OUTPUT
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "version=${{ steps.generate_release_version.outputs.version }}" >> $GITHUB_OUTPUT
          echo "version_tag=${{ steps.generate_release_version.outputs.version_tag }}" >> $GITHUB_OUTPUT
          echo "github_tag=${{ steps.generate_release_version.outputs.version_tag }}" >> $GITHUB_OUTPUT
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        fi

    - name: Output version info
      run: |
        echo "Version: ${{ steps.generate_version.outputs.version }}"
        echo "Tag: ${{ steps.generate_version.outputs.github_tag }}"
        echo "Prerelease: ${{ steps.generate_version.outputs.is_prerelease }}"

  build:
    runs-on: ubuntu-latest
    needs: generate-version
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build for deployment
      run: npm run build || echo "No build script defined"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: dist/
        if-no-files-found: ignore

  publish-release:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: [generate-version, build]
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ needs.generate-version.outputs.github_tag }}
        name: Release ${{ needs.generate-version.outputs.version }}
        draft: false
        prerelease: ${{ needs.generate-version.outputs.is_prerelease }}
        body: |
          ## Version ${{ needs.generate-version.outputs.version }}

          ### Changes
          This release includes all commits since the previous release.

          Run tests with the dev environment:
          ```bash
          make test-e2e-dev
          make test-e2e-adv
          ```

          Try it: https://jwtforge.dev
          GitHub: https://github.com/abhishektiwari/jwtforge

    - name: Deploy to Cloudflare Workers (Production)
      if: ${{ !needs.generate-version.outputs.is_prerelease }}
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Install and deploy
      if: ${{ !needs.generate-version.outputs.is_prerelease }}
      run: |
        npm ci
        npm run deploy
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  publish-prerelease:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [generate-version, build]

    steps:
    - uses: actions/checkout@v4

    - name: Comment PR with version
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `📦 Pre-release version: **${{ needs.generate-version.outputs.version }}**\n\nTag: \`${{ needs.generate-version.outputs.github_tag }}\``
          })
