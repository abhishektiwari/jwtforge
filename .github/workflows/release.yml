name: Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
    branches: [ main ]

jobs:
  generate-version:
    runs-on: ubuntu-latest
    # Skip if Tests workflow failed
    if: ${{ github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      version: ${{ steps.generate_version.outputs.version }}
      version_tag: ${{ steps.generate_version.outputs.version_tag }}
      github_tag: ${{ steps.generate_version.outputs.github_tag }}
      is_prerelease: ${{ steps.generate_version.outputs.is_prerelease }}
      pr_number: ${{ github.event.number }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Generate version for PR
      if: github.event_name == 'pull_request'
      id: generate_pr_version
      run: |
        BASE_VERSION=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 | sed 's/^v//')
        if [[ -z "$BASE_VERSION" ]]; then
          BASE_VERSION=$(node -p "require('./package.json').version || '0.0.0'")
        fi

        VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}"
        VERSION_TAG="v${VERSION}"
        GITHUB_TAG="v${BASE_VERSION}-pr${{ github.event.number }}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

        {
          echo "version=${VERSION}"
          echo "version_tag=${VERSION_TAG}"
          echo "github_tag=${GITHUB_TAG}"
          echo "is_prerelease=true"
        } >> "$GITHUB_OUTPUT"

    - name: Generate version for release
      if: github.event_name == 'workflow_run'
      id: generate_release_version
      uses: paulhatch/semantic-version@v6.0.3
      with:
        tag_prefix: "v"
        major_pattern: "(MAJOR)"
        minor_pattern: "(MINOR)"
        version_format: "${major}.${minor}.${patch}"
        bump_each_commit: true

    - name: Set outputs
      id: generate_version
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "version=${{ steps.generate_pr_version.outputs.version }}" >> $GITHUB_OUTPUT
          echo "version_tag=${{ steps.generate_pr_version.outputs.version_tag }}" >> $GITHUB_OUTPUT
          echo "github_tag=${{ steps.generate_pr_version.outputs.github_tag }}" >> $GITHUB_OUTPUT
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "version=${{ steps.generate_release_version.outputs.version }}" >> $GITHUB_OUTPUT
          echo "version_tag=${{ steps.generate_release_version.outputs.version_tag }}" >> $GITHUB_OUTPUT
          echo "github_tag=${{ steps.generate_release_version.outputs.version_tag }}" >> $GITHUB_OUTPUT
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        fi

    - name: Output version info
      run: |
        echo "Version: ${{ steps.generate_version.outputs.version }}"
        echo "Tag: ${{ steps.generate_version.outputs.github_tag }}"
        echo "Prerelease: ${{ steps.generate_version.outputs.is_prerelease }}"

  build:
    runs-on: ubuntu-latest
    needs: generate-version
    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Set package version
      run: npm version "${{ needs.generate-version.outputs.version }}" --no-git-tag-version

    - name: Build for deployment
      run: npm run build || echo "No build script defined"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-artifacts
        path: dist/
        if-no-files-found: ignore

  publish-release:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: [generate-version, build]
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v7

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.generate-version.outputs.github_tag }}
        name: ${{ needs.generate-version.outputs.version }}
        draft: false
        prerelease: ${{ needs.generate-version.outputs.is_prerelease }}
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          ## Version ${{ needs.generate-version.outputs.version }}

          ### Changes
          This release includes all commits since the previous release.

          Run tests with the dev environment:
          ```bash
          make test-e2e-dev
          make test-e2e-adv
          ```

          Try it: https://jwtforge.dev
          GitHub: https://github.com/abhishektiwari/jwtforge

  publish-prerelease:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [generate-version, build]

    steps:
    - uses: actions/checkout@v7

    - name: Create pre-release GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.generate-version.outputs.github_tag }}
        name: ${{ needs.generate-version.outputs.github_tag }}
        draft: false
        prerelease: true
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          ## ${{ needs.generate-version.outputs.github_tag }}

          This is a pre-release version for testing purposes.

          **PR**: #${{ github.event.number }}
          **Commit**: ${{ github.sha }}

    - name: Comment PR with version
      uses: actions/github-script@v9
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `📦 Pre-release version: **${{ needs.generate-version.outputs.version }}**\n\nTag: \`${{ needs.generate-version.outputs.github_tag }}\``
          })
